<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daman AI V5 Premium</title>
    <style>
        body { background: #010101; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        .container { border: 2px solid #00ff00; border-radius: 15px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 0 20px #00ff00; background: rgba(0,0,0,0.8); }
        .prediction-box { font-size: 24px; margin: 20px 0; padding: 15px; border: 1px dashed #00ff00; background: #000; }
        .timer { font-size: 18px; color: #ffcc00; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-shadow: 0 0 10px #00ff00;">DAMAN AI V5</h1>
        <div style="color: #00ff00; font-weight: bold;">🟢 SERVER: NETHERLANDS LIVE</div>
        <hr style="border: 0.5px solid #333;">
        <div class="timer">Next Prediction in: <span id="seconds">30</span>s</div>
        <div class="prediction-box">
            <div>PERIOD: <span id="period" style="color: #fff;">Searching...</span></div>
            <div style="font-size: 40px; margin-top: 10px; font-weight: bold;">
                RESULT: <span id="result" style="color: #00ff00;">WAIT...</span>
            </div>
        </div>
        <div id="status" style="font-size: 14px;">Syncing with VPS...</div>
    </div>
    <p style="font-size: 10px; color: #444; margin-top: 20px;">IP: 194.5.159.86 | HTTPS Secure Bridge Active</p>

    <script>
        async function getPrediction() {
            try {
                // Ye bridge HTTPS aur HTTP ke beech ki rukawat khatam karega
                const vpsUrl = "http://194.5.159.86:5000/get_data";
                const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(vpsUrl);
                
                const response = await fetch(proxyUrl);
                const bridge = await response.json();
                const data = JSON.parse(bridge.contents);
                
                if(data.status === "Succeed") {
                    const lastResult = data.data.list[0];
                    document.getElementById('period').innerText = lastResult.issueNumber;
                    
                    // Smart Prediction Logic
                    const num = parseInt(lastResult.number);
                    const aiResult = (num >= 5) ? "BIG / RED" : "SMALL / GREEN";
                    
                    document.getElementById('result').innerText = aiResult;
                    document.getElementById('status').innerText = "AI Analysis: Successful";
                }
            } catch (err) {
                document.getElementById('status').innerText = "Re-connecting to VPS...";
            }
        }

        setInterval(getPrediction, 3000); // Har 3 sec mein check karega
        setInterval(() => {
            let s = parseInt(document.getElementById('seconds').innerText);
            document.getElementById('seconds').innerText = s <= 1 ? 30 : s - 1;
        }, 1000);
    </script>
</body>
</html>
