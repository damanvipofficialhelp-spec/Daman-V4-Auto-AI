<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daman AI V5 Premium</title>
    <style>
        body { background: #0f0f0f; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        .container { border: 2px solid #00ff00; border-radius: 15px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 0 20px #00ff00; }
        .status { color: #00ff00; font-weight: bold; margin-bottom: 20px; }
        .prediction-box { font-size: 24px; margin: 20px 0; padding: 15px; border: 1px dashed #00ff00; }
        .timer { font-size: 18px; color: #ffcc00; }
        .footer { font-size: 12px; margin-top: 30px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>DAMAN AI V5</h1>
        <div class="status">🟢 SERVER STATUS: LIVE (NETHERLANDS)</div>
        <hr>
        <div class="timer">Next Prediction in: <span id="seconds">30</span>s</div>
        <div class="prediction-box">
            <div>PERIOD: <span id="period">Connecting...</span></div>
            <div style="font-size: 40px; margin-top: 10px;">
                RESULT: <span id="result" style="color: #fff;">WAIT...</span>
            </div>
        </div>
        <div id="pattern">AI Analyzing Live Data...</div>
    </div>
    <div class="footer">VPS: 194.5.159.86 | Secure Proxy Active</div>

    <script>
        async function fetchData() {
            try {
                // Ye Proxy URL aapke browser ki security (Mixed Content) ko bypass karega
                const proxy = "https://api.allorigins.win/raw?url=";
                const target = "http://194.5.159.86:5000/get_data";
                
                const response = await fetch(proxy + encodeURIComponent(target));
                const data = await response.json();
                
                if(data.status === "Succeed") {
                    // Daman ke live data se period number nikalna
                    const lastData = data.data.list[0];
                    document.getElementById('period').innerText = lastData.issueNumber;
                    
                    // Prediction Logic (Big/Small)
                    const number = parseInt(lastData.number);
                    const predict = (number >= 5) ? "BIG / RED" : "SMALL / GREEN";
                    
                    document.getElementById('result').innerText = predict;
                    document.getElementById('pattern').innerText = "V5 AI Analysis: Pattern Stable";
                }
            } catch (error) {
                console.log("Waiting for VPS Data...");
                document.getElementById('period').innerText = "Searching...";
            }
        }
        
        // Har 3 second mein fresh data fetch karega
        setInterval(fetchData, 3000); 
        
        // Countdown Timer Logic
        setInterval(() => {
            let s = parseInt(document.getElementById('seconds').innerText);
            document.getElementById('seconds').innerText = s <= 1 ? 30 : s - 1;
        }, 1000);
    </script>
</body>
</html>
